# Render's free plan sleeps a service after 15 minutes without traffic, and waking it
# takes 30+ seconds. Pinging the health check every 10 minutes keeps it awake, so a
# first-time visitor gets the page at once. One always-on free service uses ~744 of
# Render's 750 free instance hours a month.

name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --silent --show-error --fail --max-time 120 --retry 2 https://cu-pulse.onrender.com/api/health
